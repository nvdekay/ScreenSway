<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<!-- The script hash must match the inline script below; test/e2e.mjs checks it. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-b5QO+hP5wWiLBRJXP6yeiW0QzYGHATNao/9ONewUOo0='; style-src 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'" />
<title>ScreenSway Analytics</title>
<style>
  :root {
    color-scheme: light;
    --page: #f4f5f7; --surface: #fff; --surface-2: #f8f8fa; --ink: #17171b; --ink-2: #55545d; --muted: #85838d;
    --grid: #e7e7eb; --axis: #c8c8cf; --border: rgba(23,23,27,.09); --wash: rgba(23,23,27,.045);
    --s1: #635bff; --s2: #ff754c; --s3: #22a879; --track: #dedcff;
    --up: #11845b; --down: #d24646; --accent: #635bff; --accent-soft: #eeedff;
    --sidebar: #17171b; --sidebar-ink: #f8f8fa; --sidebar-muted: #98969f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --page: #101014; --surface: #18181d; --surface-2: #202026; --ink: #f2f1f4; --ink-2: #c2c0c7; --muted: #8c8993;
      --grid: #2c2c33; --axis: #404048; --border: rgba(255,255,255,.09); --wash: rgba(255,255,255,.05);
      --s1: #8b86ff; --s2: #ff805b; --s3: #32bd8d; --track: #302d6f;
      --up: #3bc18f; --down: #f06b6b; --accent: #817bff; --accent-soft: #292650;
      --sidebar: #0a0a0d; --sidebar-ink: #f8f8fa; --sidebar-muted: #8f8d96;
    }
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  button, input, select { font: inherit; color: inherit; }
  button { -webkit-tap-highlight-color: transparent; }
  .dashboard-shell { min-height: 100vh; padding-left: 248px; }
  .sidebar { position: fixed; inset: 0 auto 0 0; width: 248px; padding: 24px 16px 16px; background: var(--sidebar); color: var(--sidebar-ink); display: flex; flex-direction: column; z-index: 10; }
  .brand { display: flex; align-items: center; gap: 11px; padding: 0 10px 26px; }
  .brand-mark { width: 32px; height: 32px; border-radius: 10px; background: linear-gradient(145deg, #918cff, #5148ed); display: grid; place-items: center; box-shadow: 0 8px 24px rgba(99,91,255,.35); }
  .brand-mark svg { width: 18px; height: 18px; }
  .brand-name { font-size: 15px; font-weight: 700; letter-spacing: -.01em; }
  .brand-name small { display: block; color: var(--sidebar-muted); font-size: 10px; font-weight: 600; letter-spacing: .11em; text-transform: uppercase; margin-top: 1px; }
  .nav-label { color: #68666f; padding: 0 12px 8px; font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
  .side-nav { display: grid; gap: 4px; }
  .nav-item { width: 100%; border: 0; border-radius: 10px; padding: 10px 11px; background: transparent; color: var(--sidebar-muted); cursor: pointer; display: flex; align-items: center; gap: 11px; text-align: left; font-size: 13.5px; font-weight: 560; transition: background .16s, color .16s; }
  .nav-item:hover { background: rgba(255,255,255,.06); color: var(--sidebar-ink); }
  .nav-item[aria-current="page"] { background: rgba(255,255,255,.10); color: #fff; }
  .nav-item svg { width: 18px; height: 18px; flex: 0 0 auto; stroke: currentColor; }
  .sidebar-foot { margin-top: auto; border-top: 1px solid rgba(255,255,255,.08); padding-top: 12px; }
  .sidebar-foot .nav-item { color: var(--sidebar-muted); }
  .content-shell { width: 100%; min-width: 0; }
  .topbar { min-height: 76px; padding: 15px 32px; background: color-mix(in srgb, var(--surface) 92%, transparent); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 16px; position: sticky; top: 0; z-index: 8; backdrop-filter: blur(14px); }
  .page-identity { min-width: 180px; }
  .page-identity h1 { font-size: 18px; line-height: 1.25; margin: 0; font-weight: 720; letter-spacing: -.025em; }
  .topbar .meta { color: var(--muted); font-size: 11.5px; margin-top: 3px; }
  .spacer { flex: 1; }
  .seg { display: inline-flex; gap: 3px; border: 1px solid var(--border); border-radius: 10px; padding: 3px; background: var(--surface-2); }
  .seg button { border: 0; border-radius: 7px; background: none; padding: 6px 10px; cursor: pointer; color: var(--muted); font-size: 12.5px; }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 650; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .btn { border: 1px solid var(--border); background: var(--surface); border-radius: 10px; padding: 7px 11px; cursor: pointer; font-size: 12.5px; }
  .btn:hover { border-color: color-mix(in srgb, var(--accent) 40%, var(--border)); }
  .btn.primary { background: var(--accent); border-color: transparent; color: #fff; font-weight: 600; }
  .main-content { max-width: 1480px; padding: 30px 32px 64px; margin: 0 auto; }
  .view-head { margin-bottom: 22px; }
  .view-head h2 { margin: 0; color: var(--ink); font-size: 25px; line-height: 1.25; font-weight: 730; letter-spacing: -.035em; text-transform: none; }
  .view-head p { margin: 6px 0 0; color: var(--muted); font-size: 13px; }
  .section-title { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin: 30px 0 12px; }
  .section-title h3 { margin: 0; font-size: 15px; font-weight: 680; letter-spacing: -.015em; }
  .section-title span { color: var(--muted); font-size: 12px; }
  .grid { display: grid; gap: 12px; }
  .tiles { grid-template-columns: repeat(4, 1fr); }
  .two { grid-template-columns: repeat(auto-fit, minmax(min(100%, 460px), 1fr)); }
  .three { grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 18px; min-width: 0; box-shadow: 0 1px 2px rgba(0,0,0,.025); }
  .card h3 { margin: 0; font-size: 14px; font-weight: 650; }
  .card .sub { color: var(--muted); font-size: 12.5px; margin: 2px 0 12px; }
  .tile { position: relative; min-height: 126px; display: flex; flex-direction: column; justify-content: space-between; }
  .tile .label { color: var(--muted); font-size: 12.5px; font-weight: 550; }
  .tile .value { font-size: 31px; line-height: 1.1; font-weight: 720; letter-spacing: -.035em; margin: 9px 0 7px; }
  .tile.hero { background: linear-gradient(145deg, var(--accent), #7b55e7); color: #fff; border: 0; }
  .tile.hero .label, .tile.hero .delta, .tile.hero .delta b { color: rgba(255,255,255,.75); }
  .tile.hero .value { font-size: 39px; }
  .delta { font-size: 12.5px; color: var(--muted); }
  .delta b { font-weight: 600; }
  .delta .up { color: var(--up); } .delta .down { color: var(--down); }
  .legend { display: flex; gap: 14px; font-size: 12.5px; color: var(--ink-2); margin-bottom: 6px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; }
  .chart { position: relative; }
  .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .chart text { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--page); border-radius: 8px; padding: 6px 9px; font-size: 12px; white-space: nowrap; transform: translate(-50%, -100%); opacity: 0; transition: opacity .1s; z-index: 2; }
  .tip b { font-weight: 650; }
  .bars { display: grid; gap: 9px; }
  .bar-row { display: grid; grid-template-columns: minmax(90px, 38%) 1fr auto; gap: 10px; align-items: center; font-size: 13px; }
  .bar-row .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-2); }
  .bar-row .track { height: 10px; border-radius: 0 4px 4px 0; background: var(--wash); }
  .bar-row .fill { height: 100%; border-radius: 0 4px 4px 0; background: var(--s1); min-width: 2px; }
  .bar-row .num { font-variant-numeric: tabular-nums; color: var(--ink); min-width: 72px; text-align: right; }
  .bar-row .num small { color: var(--muted); }
  .empty { color: var(--muted); font-size: 13px; padding: 8px 0; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: var(--muted); font-weight: 500; padding: 6px 8px 6px 0; border-bottom: 1px solid var(--grid); }
  td { padding: 7px 8px 7px 0; border-bottom: 1px solid var(--grid); vertical-align: top; font-variant-numeric: tabular-nums; }
  td.props { color: var(--ink-2); word-break: break-word; }
  .scroll { overflow-x: auto; }
  .pill { display: inline-block; padding: 1px 7px; border-radius: 99px; background: var(--wash); font-size: 12px; }
  #login { max-width: 420px; margin: 12vh auto; }
  #login input { width: 100%; padding: 10px 12px; border-radius: 9px; border: 1px solid var(--border); background: var(--surface); margin: 10px 0; }
  #login .remember { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); margin: 0 0 6px; }
  #login .remember input { width: auto; margin: 0; }
  #login .error { color: var(--down); min-height: 1.4em; font-size: 13px; }
  .login-wrap { padding: 20px; }
  .loading { min-height: 240px; display: grid; place-items: center; color: var(--muted); }
  .funnel-table td, .funnel-table th { white-space: nowrap; }
  .note { color: var(--muted); font-size: 12.5px; margin: 8px 0 0; }
  .fb-filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px 12px; margin-top: 18px; align-items: end; }
  .fb-filters label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
  .fb-filters input, .fb-filters select, .fb-detail textarea { width: 100%; padding: 7px 9px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-2); color: var(--ink); font-size: 13px; }
  .fb-search { grid-column: span 2; }
  .fb-filter-actions { display: flex; gap: 8px; }
  .fb-list { display: grid; gap: 10px; margin-top: 12px; }
  .fb-item { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; }
  .fb-item[data-status="new"] { border-left: 3px solid var(--accent); }
  .fb-head { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 12.5px; color: var(--muted); }
  .fb-head strong { color: var(--ink); font-weight: 650; }
  .fb-stars { color: #e0a100; letter-spacing: 1px; }
  .fb-message { margin: 10px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14px; line-height: 1.55; }
  .fb-meta { margin-top: 8px; font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
  .fb-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .fb-actions .btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); font-weight: 600; }
  .fb-detail { margin-top: 10px; display: grid; gap: 8px; }
  .fb-detail textarea { min-height: 70px; resize: vertical; font-family: inherit; }
  .fb-more { display: flex; justify-content: center; margin-top: 14px; }
  @media (max-width: 760px) { .fb-search { grid-column: auto; } }
  [data-view][hidden] { display: none !important; }
  [hidden] { display: none !important; }
  @media (max-width: 1120px) { .tiles { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 760px) {
    .dashboard-shell { padding-left: 0; padding-top: 132px; }
    .sidebar { inset: 0 0 auto; width: auto; height: 132px; padding: 12px 14px 10px; }
    .brand { padding: 0 4px 10px; }
    .brand-mark { width: 28px; height: 28px; border-radius: 8px; }
    .brand-name small, .nav-label, .sidebar-foot { display: none; }
    .side-nav { display: flex; gap: 5px; overflow-x: auto; scrollbar-width: none; }
    .side-nav::-webkit-scrollbar { display: none; }
    .nav-item { width: auto; flex: 0 0 auto; padding: 8px 10px; }
    .nav-item svg { width: 16px; height: 16px; }
    .topbar { min-height: 68px; padding: 10px 16px; flex-wrap: wrap; gap: 8px; }
    .page-identity { flex: 1; min-width: 140px; }
    .page-identity h1 { font-size: 16px; }
    .topbar .meta { display: none; }
    .seg { order: 3; width: 100%; }
    .seg button { flex: 1; padding-inline: 5px; }
    .main-content { padding: 24px 16px 48px; }
    .view-head h2 { font-size: 22px; }
  }
  @media (max-width: 520px) {
    .tiles { grid-template-columns: 1fr 1fr; }
    .tile { min-height: 118px; padding: 15px; }
    .tile .value, .tile.hero .value { font-size: 27px; }
    .bar-row { grid-template-columns: minmax(76px, 35%) 1fr auto; gap: 7px; }
  }
</style>
</head>
<body>
<div class="login-wrap">
  <section id="login" class="card" hidden>
    <h1 style="margin:0 0 4px;font-size:20px">ScreenSway Analytics</h1>
    <div class="sub" style="color:var(--muted)">Đăng nhập tài khoản quản trị để xem số liệu.</div>
    <form id="login-form">
      <input id="username" name="username" type="text" autocomplete="username" placeholder="Tên đăng nhập" required />
      <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Mật khẩu" required />
      <label class="remember"><input id="remember" type="checkbox" checked /> Ghi nhớ trên máy này (30 ngày)</label>
      <div class="error" id="login-error"></div>
      <button class="btn primary" type="submit">Đăng nhập</button>
    </form>
  </section>

</div>
<div id="app" class="dashboard-shell" hidden>
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M5 7.5A2.5 2.5 0 0 1 7.5 5h9A2.5 2.5 0 0 1 19 7.5v9a2.5 2.5 0 0 1-2.5 2.5h-9A2.5 2.5 0 0 1 5 16.5v-9Z" stroke="white" stroke-width="2"/><path d="m10 9 5 3-5 3V9Z" fill="white"/></svg></span>
      <span class="brand-name">ScreenSway<small>Analytics</small></span>
    </div>
    <div class="nav-label">Quản lý</div>
    <nav class="side-nav" aria-label="Điều hướng dashboard">
      <button class="nav-item" data-nav="overview" aria-current="page"><svg viewBox="0 0 24 24" fill="none"><path d="M4 13h6V4H4v9Zm0 7h6v-4H4v4Zm10 0h6v-9h-6v9Zm0-16v4h6V4h-6Z" stroke-width="1.8"/></svg>Tổng quan</button>
      <button class="nav-item" data-nav="acquisition"><svg viewBox="0 0 24 24" fill="none"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 19h14" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>Thu hút & tải</button>
      <button class="nav-item" data-nav="audience"><svg viewBox="0 0 24 24" fill="none"><path d="M16 20v-1.7c0-2.4-1.8-4.3-4-4.3H7c-2.2 0-4 1.9-4 4.3V20m6.5-10A3.5 3.5 0 1 0 9.5 3a3.5 3.5 0 0 0 0 7Zm7-5.8a3.5 3.5 0 0 1 0 6.6M21 20v-1.7c0-2-1.2-3.6-3-4.1" stroke-width="1.8" stroke-linecap="round"/></svg>Người dùng</button>
      <button class="nav-item" data-nav="product"><svg viewBox="0 0 24 24" fill="none"><path d="M4 7.5 12 3l8 4.5v9L12 21l-8-4.5v-9ZM4.5 7.8 12 12l7.5-4.2M12 12v9" stroke-width="1.8" stroke-linejoin="round"/></svg>Sản phẩm</button>
      <button class="nav-item" data-nav="studio"><svg viewBox="0 0 24 24" fill="none"><path d="M3 6.5A2.5 2.5 0 0 1 5.5 4h13A2.5 2.5 0 0 1 21 6.5v11a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5v-11ZM3 9h18M6.5 6.5h.01M9 6.5h.01" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="14.5" r="2.5" stroke-width="1.8"/></svg>Bản web</button>
      <button class="nav-item" data-nav="journey"><svg viewBox="0 0 24 24" fill="none"><path d="M4 6h16l-5 6v6l-6 2v-8L4 6Z" stroke-width="1.8" stroke-linejoin="round"/></svg>Hành trình</button>
      <button class="nav-item" data-nav="feedback"><svg viewBox="0 0 24 24" fill="none"><path d="M5 5h14a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1h-7l-4 4v-4H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Z" stroke-width="1.8" stroke-linejoin="round"/></svg>Phản hồi</button>
      <button class="nav-item" data-nav="activity"><svg viewBox="0 0 24 24" fill="none"><path d="M4 5h16M4 12h16M4 19h16M7 3v4m8 3v4m-5 3v4" stroke-width="1.8" stroke-linecap="round"/></svg>Hoạt động</button>
    </nav>
    <div class="sidebar-foot"><button class="nav-item" id="logout"><svg viewBox="0 0 24 24" fill="none"><path d="M10 5H5v14h5m4-3 4-4-4-4m4 4H9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>Đăng xuất</button></div>
  </aside>
  <div class="content-shell">
    <header class="topbar">
      <div class="page-identity"><h1 id="page-title">Tổng quan</h1><div class="meta" id="updated"></div></div>
      <span class="spacer"></span>
      <div class="seg" id="range" role="group" aria-label="Khoảng thời gian">
        <button data-days="7">7 ngày</button><button data-days="30">30 ngày</button><button data-days="90">90 ngày</button><button data-days="365">1 năm</button>
      </div>
      <button class="btn" id="refresh">Làm mới</button>
    </header>
    <main id="content" class="main-content"><div class="loading">Đang tải dữ liệu…</div></main>
    <!-- Feedback is loaded on its own (GET /v1/feedback) and drawn with DOM nodes and textContent
         only: a message is shown as typed text and never parsed as HTML. -->
    <section id="feedback-view" class="main-content" data-view="feedback" hidden>
      <div class="view-head"><h2>Phản hồi</h2><p>Góp ý người dùng gửi từ bản web và app máy tính. Nội dung chỉ quản trị viên xem được.</p></div>
      <div class="grid tiles" id="fb-tiles"></div>
      <div class="grid three" id="fb-breakdowns" style="margin-top:12px"></div>
      <form class="card fb-filters" id="fb-filters" role="search" aria-label="Lọc phản hồi">
        <label>Loại<select name="category"><option value="">Tất cả</option></select></label>
        <label>Trạng thái<select name="status"><option value="">Tất cả</option></select></label>
        <label>Điểm<select name="rating"><option value="">Tất cả</option><option value="5">5</option><option value="4">4</option><option value="3">3</option><option value="2">2</option><option value="1">1</option></select></label>
        <label>Nguồn<select name="source"><option value="">Tất cả</option><option value="studio">Bản web</option><option value="app">App</option><option value="web">Landing</option></select></label>
        <label>Hệ điều hành<input name="os" placeholder="vd. macos-aarch64" maxlength="40" /></label>
        <label>Phiên bản<input name="version" placeholder="vd. 0.4.0" maxlength="40" /></label>
        <label>Quốc gia<input name="country" placeholder="Mã ISO, vd. VN" maxlength="2" /></label>
        <label>Từ ngày<input name="from" type="date" /></label>
        <label>Đến ngày<input name="to" type="date" /></label>
        <label class="fb-search">Tìm trong nội dung, email, ghi chú<input name="q" type="search" maxlength="200" /></label>
        <div class="fb-filter-actions"><button class="btn primary" type="submit">Lọc</button><button class="btn" type="reset">Xoá lọc</button></div>
      </form>
      <div id="fb-status" class="empty" role="status" aria-live="polite"></div>
      <div id="fb-list" class="fb-list"></div>
      <div class="fb-more"><button class="btn" id="fb-more" type="button" hidden>Tải thêm</button></div>
    </section>
  </div>
</div>
<script>
// Signing in sets an HttpOnly session cookie on this page's own Worker; the page never sees
// or stores a credential. "Ghi nhớ" keeps the session for 30 days, otherwise it ends with the
// browser session.
const TOKEN_KEY = "screensway.analytics.token", DAYS_KEY = "screensway.analytics.days";
const $ = (selector) => document.querySelector(selector);
const keep = (area) => ({ get: (k) => { try { return area().getItem(k); } catch { return null; } }, set: (k, v) => { try { v === null ? area().removeItem(k) : area().setItem(k, v); } catch {} } });
const store = keep(() => localStorage), session = keep(() => sessionStorage);
store.set(TOKEN_KEY, null); session.set(TOKEN_KEY, null); // tokens kept by older versions of this page
let signedIn = false, days = Number(store.get(DAYS_KEY)) || 30;
const VIEW_NAMES = { overview: "Tổng quan", acquisition: "Thu hút & tải", audience: "Người dùng", product: "Sản phẩm", studio: "Bản web", journey: "Hành trình", feedback: "Phản hồi", activity: "Hoạt động" };
let currentView = VIEW_NAMES[location.hash.slice(1)] ? location.hash.slice(1) : "overview";

const esc = (value) => String(value).replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[ch]);
const compact = (n) => (n >= 1e6 ? (n / 1e6).toFixed(1).replace(/\.0$/, "") + "M" : n >= 1e4 ? (n / 1e3).toFixed(1).replace(/\.0$/, "") + "K" : n.toLocaleString("vi-VN"));
// ── Presentation layer ────────────────────────────────────────────────────────────────

// One time-series chart: stacked columns or lines, a single y axis, with a hover readout.
function chart(series, defs, kind) {
  const W = 640, H = 220, L = 34, R = 8, T = 10, B = 24, pw = W - L - R, ph = H - T - B;
  const totals = series.map((row) => (kind === "columns" ? defs.reduce((a, d) => a + row[d.key], 0) : Math.max(...defs.map((d) => row[d.key]))));
  // Four gridlines on whole, round numbers: the tick unit is 1, 2 or 5 times a power of ten.
  const rawMax = Math.max(1, ...totals), pow = Math.pow(10, Math.floor(Math.log10(rawMax / 4 || 1)));
  const unit = [1, 2, 5, 10].map((m) => Math.max(1, m * pow)).find((u) => u * 4 >= rawMax), max = unit * 4;
  const y = (v) => T + ph - (v / max) * ph, n = series.length, slot = pw / n, x = (i) => L + slot * (i + 0.5);
  let svg = "";
  for (let k = 0; k <= 4; k++) {
    const v = (max / 4) * k;
    svg += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="${k ? "var(--grid)" : "var(--axis)"}" stroke-width="1"/><text x="${L - 6}" y="${y(v) + 3.5}" text-anchor="end">${compact(v)}</text>`;
  }
  const every = Math.ceil(n / 8);
  series.forEach((row, i) => { if ((n - 1 - i) % every === 0) svg += `<text x="${x(i)}" y="${H - 6}" text-anchor="middle">${shortDay(row.day)}</text>`; });
  if (kind === "columns") {
    const bw = Math.min(24, Math.max(2, slot - 2));
    series.forEach((row, i) => {
      let base = 0;
      defs.forEach((d, di) => {
        const v = row[d.key]; if (!v) return;
        const top = y(base + v), bottom = y(base) - (base ? 2 : 0), h = Math.max(1, bottom - top), last = defs.slice(di + 1).every((o) => !row[o.key]), r = last ? Math.min(4, h, bw / 2) : 0;
        svg += `<path d="M${x(i) - bw / 2},${top + h} v${-(h - r)} q0,${-r} ${r},${-r} h${bw - 2 * r} q${r},0 ${r},${r} v${h - r} z" fill="${d.color}"/>`;
        base += v;
      });
    });
  } else {
    defs.forEach((d, di) => {
      const points = series.map((row, i) => `${x(i)},${y(row[d.key])}`);
      if (di === 0 && defs.length === 1) svg += `<path d="M${x(0)},${y(0)} L${points.join(" L")} L${x(n - 1)},${y(0)} z" fill="${d.color}" opacity=".1"/>`;
      svg += `<path d="M${points.join(" L")}" fill="none" stroke="${d.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
      svg += `<circle cx="${x(n - 1)}" cy="${y(series[n - 1][d.key])}" r="4" fill="${d.color}" stroke="var(--surface)" stroke-width="2"/>`;
    });
  }
  svg += `<line class="cross" x1="0" x2="0" y1="${T}" y2="${T + ph}" stroke="var(--axis)" stroke-width="1" opacity="0"/>`;
  const legend = defs.length > 1 ? `<div class="legend">${defs.map((d) => `<span><i style="background:${d.color}"></i>${d.name}</span>`).join("")}</div>` : "";
  const data = esc(JSON.stringify({ series: series.map((row) => [row.day, ...defs.map((d) => row[d.key])]), names: defs.map((d) => d.name), colors: defs.map((d) => d.color), L, slot, W, kind }));
  return `${legend}<div class="chart" data-chart="${data}"><svg viewBox="0 0 ${W} ${H}" role="img">${svg}</svg><div class="tip"></div></div>`;
}
function wireCharts() {

    const move = (event) => {

function showView(view, updateUrl = true) {
  if (!VIEW_NAMES[view]) view = "overview";
  currentView = view;
  document.querySelectorAll("[data-view]").forEach((section) => { section.hidden = section.dataset.view !== view; });
  document.querySelectorAll("[data-nav]").forEach((button) => {
    if (button.dataset.nav === view) button.setAttribute("aria-current", "page");

  });
  $("#page-title").textContent = VIEW_NAMES[view];
  // Feedback has its own container; the stats container would only add empty padding.
  $("#content").hidden = view === "feedback";
  if (view === "feedback" && signedIn && !$("#fb-list").children.length) void loadFeedback(true);
  if (updateUrl) history.replaceState(null, "", `${location.pathname}${location.search}#${view}`);
  window.scrollTo({ top: 0, behavior: "smooth" });
}

const DIMENSIONS = { os: ["Hệ điều hành", osName], browser: ["Trình duyệt", label], version: ["Phiên bản", (v) => v], country: ["Quốc gia", countryName], locale: ["Ngôn ngữ", localeName], referrer: ["Nguồn truy cập", label] };
function funnelBars(steps, names) {

  return barList(names.map(([key, name]) => ({ key: name, count: steps[key] ?? 0 })), { name: (key) => key, secondary: (item) => `${Math.round((item.count / base) * 100)}%` });

function funnelTable(by) {

  return sections.map(([dimension, list]) => {
    const [title, name] = DIMENSIONS[dimension] ?? [dimension, (v) => v];
    return `<div class="card scroll"><h3>Theo ${esc(title.toLocaleLowerCase("vi-VN"))}</h3><table class="funnel-table"><thead><tr><th>${esc(title)}</th><th>Mở</th><th>Quay xong</th><th>Xuất xong</th><th>Tỉ lệ xuất</th></tr></thead><tbody>${list.map((row) =>

  }).join("");
}

      </div>
      <div class="section-title"><h3>Mức độ sử dụng</h3><span>Tính năng và style phổ biến</span></div>
      <div class="grid two">
        ${card("Tính năng dùng nhiều nhất", "Xếp theo lượt dùng và số máy", barList(appEvents.map((event) => ({ key: EVENT_NAMES[event.name] ?? event.name, count: event.count, actors: event.actors })), { secondary: (item) => `${compact(item.actors)} máy` }))}
        ${card("Style được áp dụng", "Style có sẵn hoặc tự lưu", barList(B("styleApplied")))}

        ${card("Nền khi xuất", "Loại nền", barList(B("exportBackground")))}
        ${card("Xuất kèm phụ đề", "Có hoặc không", barList(B("exportCaptions")))}
        ${card("Auto-zoom", "Bật hoặc tắt", barList(B("exportAutoZoom")))}

        ${card("Micro", "Bật hoặc tắt", barList(B("recordingMicrophone")))}
        ${card("Độ dài bản ghi", "Theo nhóm thời lượng", barList(B("recordingDuration")))}

    ${studioView(data.studio)}

    <section data-view="activity" hidden>
      <div class="view-head"><h2>Hoạt động gần đây</h2><p>Dòng sự kiện mới nhất từ landing page, bản web và ứng dụng desktop.</p></div>
      <div class="card scroll"><table>
      <thead><tr><th>Thời gian (giờ VN)</th><th>Nguồn</th><th>Sự kiện</th><th>Phiên bản</th><th>Hệ điều hành</th><th>Quốc gia</th><th>Ngôn ngữ</th><th>Chi tiết</th></tr></thead>
      <tbody>${data.recent.map((event) => `<tr>
        <td>${dateTime(event.ts)}</td>
        <td><span class="pill">${esc(sourceName(event.source))}</span></td>
        <td>${esc(eventName(event.name))}</td>
        <td>${event.version ? esc(event.version) : event.source === "web" ? `<span title="Landing page không có phiên bản app">—</span>` : "Không rõ"}</td>
        <td>${esc(osName(event.os))}</td><td>${esc(countryName(event.country))}</td><td>${event.locale ? esc(localeName(event.locale)) : "—"}</td>
        <td class="props">${event.props ? esc(Object.entries(event.props).map(([k, v]) => `${propName(k)}: ${propValue(k, v)}`).join(" · ")) : ""}</td></tr>`).join("") || `<tr><td colspan="8" class="empty">Chưa có sự kiện nào.</td></tr>`}</tbody>
      </table></div>

  wireCharts();
  showView(currentView, false);
}

// ── Phản hồi ─────────────────────────────────────────────────────────────────────────
// Feedback text is user content: it is only ever put into the page with textContent, never
// with innerHTML, so HTML or script in a message shows as plain text. URLs are not linked.
const el = (tag, props = {}, ...children) => {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(props)) {
    if (key === "text") node.textContent = value;
    else if (key === "class") node.className = value;
    else if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
    else node.setAttribute(key, value);
  }
  for (const child of children) if (child !== null && child !== undefined) node.append(child);
  return node;
};
let feedbackState = { filters: {}, cursor: null, loading: false };
function fillFeedbackSelects() {
  const form = $("#fb-filters");
  for (const [name, names] of [["category", VI.feedbackCategories], ["status", VI.feedbackStatuses]]) {
    const select = form.elements[name];
    if (select.options.length > 1) continue;
    for (const [value, text] of Object.entries(names)) select.append(el("option", { value, text }));
  }
}
function feedbackTile(name, value, note, hero = false) {
  return el("div", { class: `card tile${hero ? " hero" : ""}` }, el("div", { class: "label", text: name }), el("div", { class: "value", text: value }), el("span", { class: "delta", text: note }));
}
function feedbackBars(title, items, name) {
  const box = el("div", { class: "card" }, el("h3", { text: title }));
  if (!items.length) { box.append(el("div", { class: "empty", text: "Chưa có dữ liệu." })); return box; }
  const max = Math.max(...items.map((item) => item.count));
  const bars = el("div", { class: "bars" });
  for (const item of items) {
    const fill = el("span", { class: "fill" });
    fill.style.width = `${(item.count / max) * 100}%`;
    fill.style.display = "block";
    bars.append(el("div", { class: "bar-row" }, el("span", { class: "name", text: name(item.key) }), el("span", { class: "track" }, fill), el("span", { class: "num", text: item.count.toLocaleString("vi-VN") })));
  }
  box.append(bars);
  return box;
}
function renderFeedbackSummary(summary) {
  const average = summary.averageRating === null ? "–" : summary.averageRating.toFixed(1).replace(".", ",");
  $("#fb-tiles").replaceChildren(
    feedbackTile("Phản hồi (theo bộ lọc)", summary.total.toLocaleString("vi-VN"), "tổng số tin nhắn", true),
    feedbackTile("Chưa đọc", summary.unread.toLocaleString("vi-VN"), "trạng thái Mới"),
    feedbackTile("Điểm trung bình", average, `${summary.rated.toLocaleString("vi-VN")} phản hồi có chấm điểm`),
    feedbackTile("Báo lỗi", String(summary.categories.find((row) => row.key === "bug")?.count ?? 0), "phản hồi loại Báo lỗi"),
  );
  const ratings = [5, 4, 3, 2, 1].map((n) => ({ key: String(n), count: summary.ratings.find((row) => row.key === String(n))?.count ?? 0 }));
  $("#fb-breakdowns").replaceChildren(
    feedbackBars("Phân bố điểm", ratings.some((row) => row.count) ? ratings : [], (key) => `${key} sao`),
    feedbackBars("Theo loại", summary.categories, categoryName),
    feedbackBars("Theo trạng thái", summary.statuses, statusName),
    feedbackBars("Theo nguồn", summary.sources, sourceName),
    feedbackBars("Theo hệ điều hành", summary.os, osName),
    feedbackBars("Theo phiên bản", summary.versions, (key) => (key === "unknown" ? "Không rõ" : key)),
    feedbackBars("Theo quốc gia", summary.countries, countryName),
  );
}
async function patchFeedback(item, change, node) {
  const status = $("#fb-status");
  try {
    const response = await fetch(`/v1/feedback/${item.id}`, { method: "PATCH", headers: { "Content-Type": "application/json", "X-ScreenSway-Dashboard": "1" }, body: JSON.stringify(change) });
    if (response.status === 401) return showLogin("Phiên đăng nhập đã hết, đăng nhập lại.");
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    Object.assign(item, change.status ? { status: change.status } : {}, change.adminNote !== undefined ? { adminNote: change.adminNote || null } : {});
    node.replaceWith(feedbackItem(item, true));
    status.textContent = "Đã lưu thay đổi.";
  } catch (error) {
    status.textContent = `Không lưu được (${error.message}). Thử lại.`;
  }
}
function feedbackItem(item, open = false) {
  const stars = item.rating ? "★".repeat(item.rating) + "☆".repeat(5 - item.rating) : null;
  const node = el("article", { class: "fb-item", "data-status": item.status });
  const head = el("div", { class: "fb-head" },
    el("strong", { text: categoryName(item.category) }),
    el("span", { class: "pill", text: statusName(item.status) }),
    stars ? el("span", { class: "fb-stars", title: `${item.rating}/5`, text: stars }) : null,
    el("span", { text: dateTime(item.createdAt) }),
    el("span", { text: `${sourceName(item.source)}${item.version ? ` ${item.version}` : ""}` }),
  );
  const meta = el("div", { class: "fb-meta", text: [
    item.os ? osName(item.os) : null, item.browser ? label(item.browser) : null, item.locale ? localeName(item.locale) : null,
    item.country ? countryName(item.country) : null, item.email ? `Email: ${item.email}` : "Không để lại email",
  ].filter(Boolean).join(" · ") });
  // The message: plain text, line breaks kept by CSS (white-space: pre-wrap).
  const message = el("p", { class: "fb-message" });
  message.textContent = item.message;
  const toggle = el("button", { class: "btn", type: "button", text: open ? "Thu gọn" : "Chi tiết & xử lý", "aria-expanded": String(open) });
  node.append(head, message, meta, el("div", { class: "fb-actions" }, toggle));
  if (open) {
    const actions = el("div", { class: "fb-actions" }, ...Object.entries(VI.feedbackStatuses).map(([value, text]) =>
      el("button", { class: "btn", type: "button", text, "aria-pressed": String(item.status === value), onclick: () => patchFeedback(item, { status: value }, node) })));
    const note = el("textarea", { maxlength: "2000", placeholder: "Ghi chú nội bộ (chỉ quản trị viên thấy)", "aria-label": "Ghi chú nội bộ" });
    note.value = item.adminNote ?? "";
    node.append(el("div", { class: "fb-detail" },
      el("div", { class: "fb-meta", text: `Mã #${item.id} · ngày ${fullDay(item.day)} · cập nhật ${dateTime(item.updatedAt)}` }),
      actions, note,
      el("div", { class: "fb-actions" }, el("button", { class: "btn primary", type: "button", text: "Lưu ghi chú", onclick: () => patchFeedback(item, { adminNote: note.value }, node) })),
    ));
    // Opening an unread message marks it read.
    if (item.status === "new") void patchFeedback(item, { status: "read" }, node);
  }
  toggle.addEventListener("click", () => node.replaceWith(feedbackItem(item, !open)));
  return node;
}
async function loadFeedback(reset = true) {
  if (feedbackState.loading) return;
  feedbackState.loading = true;
  fillFeedbackSelects();
  const status = $("#fb-status"), list = $("#fb-list"), more = $("#fb-more");
  status.textContent = "Đang tải phản hồi…";
  const params = new URLSearchParams({ limit: "25" });
  for (const [key, value] of Object.entries(feedbackState.filters)) if (value) params.set(key, value);
  if (!reset && feedbackState.cursor) params.set("cursor", String(feedbackState.cursor));
  try {
    const response = await fetch(`/v1/feedback?${params}`);
    if (response.status === 401) return showLogin("Phiên đăng nhập đã hết, đăng nhập lại.");
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const data = await response.json();
    if (reset) list.replaceChildren();
    for (const item of data.items) list.append(feedbackItem(item));
    feedbackState.cursor = data.nextCursor;
    more.hidden = !data.nextCursor;
    renderFeedbackSummary(data.summary);
    status.textContent = list.children.length ? `Đang hiện ${list.children.length.toLocaleString("vi-VN")} / ${data.summary.total.toLocaleString("vi-VN")} phản hồi.` : "Chưa có phản hồi nào khớp bộ lọc.";
  } catch (error) {
    status.textContent = `Không tải được phản hồi (${error.message}). Bấm “Lọc” để thử lại.`;
  } finally {
    feedbackState.loading = false;
  }
}
$("#fb-filters").addEventListener("submit", (event) => {
  event.preventDefault();
  const form = new FormData(event.target);
  feedbackState.filters = Object.fromEntries([...form.entries()].map(([key, value]) => [key, String(value).trim()]).filter(([, value]) => value));
  if (feedbackState.filters.country) feedbackState.filters.country = feedbackState.filters.country.toUpperCase();
  void loadFeedback(true);
});
$("#fb-filters").addEventListener("reset", () => { feedbackState.filters = {}; setTimeout(() => void loadFeedback(true)); });
$("#fb-more").addEventListener("click", () => void loadFeedback(false));

async function load(fresh = false) {
  document.querySelectorAll("#range button").forEach((button) => button.setAttribute("aria-pressed", String(Number(button.dataset.days) === days)));
  try {
    const response = await fetch(`/v1/stats?days=${days}${fresh ? "&fresh=1" : ""}`);
    if (response.status === 401) return showLogin(signedIn ? "Phiên đăng nhập đã hết, đăng nhập lại." : "");
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    signedIn = true;
    $("#login").hidden = true; $("#app").hidden = false;
    render(await response.json());
  } catch (error) {
    $("#login").hidden = true; $("#app").hidden = false;
    $("#content").innerHTML = `<div class="card empty">Không tải được số liệu (${esc(error.message)}). Thử bấm “Làm mới”.</div>`;
  }
}
function showLogin(message = "") {
  signedIn = false;
  $("#app").hidden = true; $("#login").hidden = false; $("#login-error").textContent = message;
}
$("#login-form").addEventListener("submit", async (event) => {
  event.preventDefault();
  const button = event.target.querySelector("button");
  button.disabled = true; $("#login-error").textContent = "";
  try {
    const response = await fetch("/v1/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ username: $("#username").value.trim(), password: $("#password").value, remember: $("#remember").checked }) });
    if (response.status === 401) return showLogin("Sai tên đăng nhập hoặc mật khẩu.");
    if (response.status === 429) return showLogin("Thử sai quá nhiều lần. Đợi một phút rồi thử lại.");
    if (!response.ok) return showLogin(`Không đăng nhập được (HTTP ${response.status}).`);
    $("#password").value = "";
    await load();
  } catch (error) {
    showLogin(`Không đăng nhập được (${error.message}).`);
  } finally {
    button.disabled = false;
  }
});
document.querySelector(".side-nav").addEventListener("click", (event) => {
  const button = event.target.closest("[data-nav]");
  if (button) showView(button.dataset.nav);
});
$("#range").addEventListener("click", (event) => { const d = Number(event.target.dataset?.days); if (d) { days = d; store.set(DAYS_KEY, String(d)); void load(); } });
$("#refresh").addEventListener("click", () => { void load(true); if (currentView === "feedback") void loadFeedback(true); });
$("#logout").addEventListener("click", async () => { await fetch("/v1/logout", { method: "POST" }).catch(() => {}); showLogin(); });
// Reports read every event in the range: refresh every five minutes, or with "Làm mới".
setInterval(() => { if (signedIn && !document.hidden) void load(); }, 300000);
void load();
</script>
