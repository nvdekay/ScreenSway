name = "screensway-analytics"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Served on the site's own domain; the workers.dev address stays on for app versions
# (0.3.x) that still send there.
routes = [{ pattern = "stats.screensway.site", custom_domain = true }]
workers_dev = true

# The dashboard is a static page; everything under /v1 is handled by the Worker.
[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "screensway-analytics"
# Created with `wrangler d1 create screensway-analytics` (see docs/analytics.md).
database_id = "9c27780f-e0d6-48ff-8a12-f61d29ac2965"
migrations_dir = "migrations"

# POST /v1/events per client address. A visit sends a few beacons and the app sends one
# batch per flush, so this only stops scripted floods (requests over it get 429). It is
# generous because mobile carriers put many people behind one address (CGNAT).
[[ratelimits]]
name = "INGEST_LIMITER"
namespace_id = "1001"
simple = { limit = 120, period = 60 }

[vars]
# Days in the dashboard follow this offset from UTC (420 = Asia/Ho_Chi_Minh).
TZ_OFFSET_MINUTES = "420"

# Secrets (set with `wrangler secret put`, or in .dev.vars for local runs):
#   DASHBOARD_TOKEN  bearer token for GET /v1/stats
#   ACTOR_SALT       salt for the daily-rotating visitor hash
