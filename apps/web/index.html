<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <style>
      /* Moving between the landing page and the browser app (./app/) stays in the tab with a short
         cross-fade. Declared here, in both pages, so it applies before any script or stylesheet loads. */
      @view-transition { navigation: auto; }
      ::view-transition-old(root) { animation: page-out .2s ease both; }
      ::view-transition-new(root) { animation: page-in .32s ease both; }
      @keyframes page-out { to { opacity: 0; transform: translateY(-6px); } }
      @keyframes page-in { from { opacity: 0; transform: translateY(8px); } }
      @media (prefers-reduced-motion: reduce) { ::view-transition-old(root), ::view-transition-new(root) { animation: none; } }
    </style>
    <script>
      // Compose the opening frame before first paint; the app plays the sequence and removes the class.
      try {
        if (!window.matchMedia || !matchMedia("(prefers-reduced-motion: reduce)").matches) {
          document.documentElement.classList.add("anim");
          // If the app never starts, do not leave the opening frame hidden.
          setTimeout(function () {
            if (!document.documentElement.classList.contains("play")) document.documentElement.classList.remove("anim");
          }, 6000);
        }
      } catch (error) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="description" content="Record, style and export beautiful screen videos. Auto zoom, system audio and microphone, editable timelines, on-device captions and 4K MP4 export. Free for macOS and Windows." />
    <meta property="og:title" content="ScreenSway — Record your screen. Polished on the first take." />
    <meta property="og:description" content="Your free screen recording studio: automatic zoom, custom styles, audio, local captions and up to 4K export. Available for macOS and Windows x64." />
    <title>ScreenSway — Beautiful screen recordings, automatically</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
