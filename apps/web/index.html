<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08080d" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f6f5fb" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark light" />
    <script>
      // Apply a remembered theme before first paint so the page never flashes the wrong one.
      try {
        var theme = localStorage.getItem("screensway.theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch (error) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="description" content="Record, style and export beautiful screen videos. Auto zoom, system audio and microphone, editable timelines, on-device captions and 4K MP4 export. Free for macOS and Windows." />
    <meta property="og:title" content="ScreenSway — Record your screen. Make it worth watching." />
    <meta property="og:description" content="Your free screen recording studio: automatic zoom, custom styles, audio, local captions and up to 4K export. Available for macOS and Windows x64." />
    <title>ScreenSway — Beautiful screen recordings, automatically</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
