<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08080d" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f6f5fb" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark light" />
    <script>
      // Apply a remembered theme before first paint so the page never flashes the wrong one.
      try {
        var theme = localStorage.getItem("screensway.theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch (error) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="description" content="ScreenSway follows every click with smooth, cinematic zooms. Free, no watermark, and everything stays on your Mac." />
    <meta property="og:title" content="ScreenSway — Your screen knows where to look" />
    <meta property="og:description" content="Beautiful screen recordings with automatic zooms. Free for macOS and Windows." />
    <title>ScreenSway — Beautiful screen recordings, automatically</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
