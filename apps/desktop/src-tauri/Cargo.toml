[package]
name = "screensway"
version = "0.4.1"
description = "Local-first screen recorder with automatic cursor-aware camera movement"
authors = ["ScreenSway"]
edition = "2021"
license = "Proprietary"

[lib]
name = "screensway_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
dirs = "7"
fs2 = "0.4"
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "macos-private-api"] }
# Optional anonymous usage statistics (src/telemetry.rs). The system TLS stack keeps the
# binary small and needs no C toolchain when cross-checking the Windows target.
ureq = { version = "2", default-features = false, features = ["native-tls"] }
native-tls = "0.2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2"


# Smaller release binaries: the app is mostly glue around the webview and the
# capture helper, so size matters more than peak throughput here.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
# Keep unwinding: wry catches Objective-C exceptions from WebKit (for example when a
# webview goes away while a request is pending), which does not work with panic = "abort".
strip = true

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
