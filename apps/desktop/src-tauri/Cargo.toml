[package]
name = "screensway"
version = "0.1.0"
description = "Local-first screen recorder with automatic cursor-aware camera movement"
authors = ["ScreenSway"]
edition = "2021"
license = "Proprietary"

[lib]
name = "screensway_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "macos-private-api"] }

