name: Windows build

# Builds and tests the Windows app on every relevant change to main and uploads the
# installer as a workflow artifact when storage allows. Release dispatches also publish the public download.
# The build job runs third-party build code, so it gets a read-only token and never sees
# the updater key; only the small publish job signs the installer and writes the release.
on:
  push:
    branches: [main]
    paths:
      - "native/windows-capture/**"
      - ".cargo/**"
      - "apps/desktop/**"
      - "packages/core/**"
      - "scripts/build-native.mjs"
      - "scripts/test-windows-capture.mjs"
      - "scripts/test-windows-export.mjs"
      - "scripts/test-windows-transcribe.mjs"
      - "scripts/setup-windows-speech.mjs"
      - "pnpm-lock.yaml"
      - ".github/workflows/windows.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the installer to the matching release and deploy the site
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.9.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: speech-${{ hashFiles('.cargo/**') }}
          workspaces: |
            native/windows-capture -> target
            apps/desktop/src-tauri -> target

      - name: Configure native speech toolchain
        shell: pwsh
        run: |
          if (!(Test-Path "C:\Program Files\LLVM\bin\libclang.dll")) { choco install llvm -y --no-progress }
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Test the capture helper
        run: cargo test --manifest-path native/windows-capture/Cargo.toml
      - run: pnpm install --frozen-lockfile
      - run: pnpm setup:windows-speech
      - run: pnpm test && pnpm typecheck
      - run: pnpm build:capture:windows
      - name: Verify native export when a video device is available
        env:
          SCREENSWAY_ALLOW_MISSING_VIDEO_DEVICE: "1"
        run: |
          choco install ffmpeg -y --no-progress
          node scripts/test-windows-export.mjs
      - name: Test the desktop shell
        run: cargo test --lib --manifest-path apps/desktop/src-tauri/Cargo.toml

      # Hosted runners may not allow screen capture; the real test runs on a Windows PC.
      - name: Try a real capture
        continue-on-error: true
        run: node scripts/test-windows-capture.mjs

      # Unsigned for updates here; the publish job signs the installer it ships.
      - run: pnpm build:windows --config src-tauri/tauri.unsigned.conf.json
      # Test installers are a convenience: a full artifact quota must not fail the build.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !inputs.publish }}
        continue-on-error: true
        with:
          name: ScreenSway-windows-x64-setup
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          # About 500 MB each: keep test installers briefly so they do not fill the storage quota.
          retention-days: 3
      # The publish job gets the installer through the Actions cache, which has its own
      # storage, so a full artifact quota cannot block a release.
      - name: Collect the installer for publishing
        if: ${{ inputs.publish }}
        shell: bash
        run: |
          mkdir nsis
          cp apps/desktop/src-tauri/target/release/bundle/nsis/*.exe nsis/
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ inputs.publish }}
        with:
          path: nsis
          key: windows-release-${{ github.run_id }}
          enableCrossOsArchive: true

  publish-windows:
    needs: build-windows
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      # Starts the landing page deploy.
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: nsis
          key: windows-release-${{ github.run_id }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Sign the installer for the updater
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          shopt -s nullglob
          installers=(nsis/*.exe)
          if [ "${#installers[@]}" -ne 1 ]; then echo "::error::Expected exactly one installer"; exit 1; fi
          # The CLI version the lockfile pins, without installing the workspace's dependencies.
          CLI_VERSION=$(grep -A2 "^      '@tauri-apps/cli':" pnpm-lock.yaml | sed -n 's/^ *version: //p' | head -1)
          test -n "$CLI_VERSION"
          npx --yes "@tauri-apps/cli@$CLI_VERSION" signer sign "${installers[0]}"
          test -s "${installers[0]}.sig"
      - name: Publish Windows installer and deploy downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          TAG="v$VERSION"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null || { echo "::error::Matching release $TAG does not exist"; exit 1; }
          INSTALLER=$(ls nsis/*.exe)
          ASSET=ScreenSway-windows-x64-setup.exe
          cp "$INSTALLER" "$ASSET"
          cp "$INSTALLER.sig" "$ASSET.sig"
          sha256sum "$ASSET" > "$ASSET.sha256"
          # --clobber lets a failed publish be re-run for the same tag.
          gh release upload "$TAG" "$ASSET" "$ASSET.sha256" "$ASSET.sig" --clobber --repo "$GITHUB_REPOSITORY"
          gh cache delete "windows-release-$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" || true
          gh workflow run web.yml --repo "$GITHUB_REPOSITORY" --ref main
