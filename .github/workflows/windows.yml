name: Windows build

# Builds and tests the Windows app on every relevant change to main and uploads the
# installer as a workflow artifact. Release dispatches also publish the public download.
on:
  push:
    branches: [main]
    paths:
      - "native/windows-capture/**"
      - ".cargo/**"
      - "apps/desktop/**"
      - "packages/core/**"
      - "scripts/build-native.mjs"
      - "scripts/test-windows-capture.mjs"
      - "scripts/test-windows-export.mjs"
      - "scripts/test-windows-transcribe.mjs"
      - "scripts/setup-windows-speech.mjs"
      - "pnpm-lock.yaml"
      - ".github/workflows/windows.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the installer to the matching release and deploy the site
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: speech-${{ hashFiles('.cargo/**') }}
          workspaces: |
            native/windows-capture -> target
            apps/desktop/src-tauri -> target

      - name: Configure native speech toolchain
        shell: pwsh
        run: |
          if (!(Test-Path "C:\Program Files\LLVM\bin\libclang.dll")) { choco install llvm -y --no-progress }
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Test the capture helper
        run: cargo test --manifest-path native/windows-capture/Cargo.toml
      - run: pnpm install --frozen-lockfile
      - run: pnpm setup:windows-speech
      - run: pnpm test && pnpm typecheck
      - run: pnpm build:capture:windows
      - name: Verify native export when a video device is available
        env:
          SCREENSWAY_ALLOW_MISSING_VIDEO_DEVICE: "1"
        run: |
          choco install ffmpeg -y --no-progress
          node scripts/test-windows-export.mjs
      - name: Test the desktop shell
        run: cargo test --lib --manifest-path apps/desktop/src-tauri/Cargo.toml

      # Hosted runners may not allow screen capture; the real test runs on a Windows PC.
      - name: Try a real capture
        continue-on-error: true
        run: node scripts/test-windows-capture.mjs

      - run: pnpm build:windows
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v7
        with:
          name: ScreenSway-windows-x64-setup
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe.sig
          if-no-files-found: error

      - name: Publish Windows installer and deploy downloads
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content apps/desktop/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $tag = "v$version"
          gh release view $tag --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw "Matching release $tag does not exist" }
          $installer = Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if ($installer.Count -ne 1) { throw "Expected exactly one installer" }
          if (!(Test-Path "$($installer.FullName).sig")) { throw "Updater signature is missing" }
          $asset = "ScreenSway-windows-x64-setup.exe"
          Copy-Item -LiteralPath $installer.FullName -Destination $asset
          Copy-Item -LiteralPath "$($installer.FullName).sig" -Destination "$asset.sig"
          $hash = (Get-FileHash -Algorithm SHA256 $asset).Hash.ToLowerInvariant()
          "$hash  $asset" | Set-Content -Encoding ascii "$asset.sha256"
          gh release upload $tag $asset "$asset.sha256" "$asset.sig" --clobber --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw "Windows release upload failed" }
          gh workflow run web.yml --repo $env:GITHUB_REPOSITORY --ref main
          if ($LASTEXITCODE -ne 0) { throw "Landing page dispatch failed" }
