name: Release macOS app

on:
  push:
    tags:
      - "v*"

# The build job runs third-party build code with the updater key (Tauri signs the
# updater bundle while bundling), so it only gets a read-only token. The publish job
# holds the write permissions and runs no project dependencies.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-macos:
    # The capture helper uses macOS 15 APIs and the app uses Liquid Glass, so build
    # with the macOS 26 SDK. Windows is built by the dispatched Windows workflow.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.9.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Check the tag matches the app version
        run: |
          VERSION=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the app version $VERSION in tauri.conf.json"
            exit 1
          fi

      - run: pnpm install --frozen-lockfile
      - run: pnpm test && pnpm typecheck
      # Builds the universal app, bundles the DMG, and recompresses it with LZMA.
      - run: pnpm build:macos
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Verify the DMG
        run: |
          DMG=$(ls apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          MOUNT=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$MOUNT" "$DMG"
          APP="$MOUNT/ScreenSway.app"
          codesign --verify --deep --strict "$APP"
          for binary in screensway screensway-capture; do
            lipo "$APP/Contents/MacOS/$binary" -verify_arch arm64 x86_64
          done
          test -f "$APP/Contents/Resources/icon.icns"
          hdiutil detach "$MOUNT"
          cp "$DMG" ScreenSway-macos-universal.dmg
          UPDATER=$(find apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle -name '*.app.tar.gz' -print -quit)
          test -n "$UPDATER"
          test -f "$UPDATER.sig"
          cp "$UPDATER" ScreenSway-macos-universal.app.tar.gz
          cp "$UPDATER.sig" ScreenSway-macos-universal.app.tar.gz.sig
          shasum -a 256 ScreenSway-macos-universal.dmg | tee checksum.txt
          for asset in ScreenSway-macos-universal.dmg ScreenSway-macos-universal.app.tar.gz; do
            shasum -a 256 "$asset" > "$asset.sha256"
          done

      # Hands the files to the publish job through the Actions cache: it has its own storage,
      # so a full artifact quota cannot block a release.
      - run: |
          mkdir release-files
          mv checksum.txt ScreenSway-macos-universal.* release-files/
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: release-files
          key: macos-release-${{ github.run_id }}

  publish-macos:
    needs: release-macos
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      # Needed to start the Windows publish, which then deploys the landing page.
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: release-files
          key: macos-release-${{ github.run_id }}
          fail-on-cache-miss: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv release-files/* .
          CHECKSUM=$(cut -d ' ' -f 1 checksum.txt)
          sed "s/__CHECKSUM__/$CHECKSUM/" .github/release-notes.md > notes.md
          gh release create "$GITHUB_REF_NAME" \
            ScreenSway-macos-universal.dmg \
            ScreenSway-macos-universal.dmg.sha256 \
            ScreenSway-macos-universal.app.tar.gz \
            ScreenSway-macos-universal.app.tar.gz.sha256 \
            ScreenSway-macos-universal.app.tar.gz.sig \
            --title "ScreenSway $GITHUB_REF_NAME" \
            --notes-file notes.md \
            --generate-notes \
            --verify-tag
          gh cache delete "macos-release-$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" || true

      # Releases created with GITHUB_TOKEN do not trigger other workflows, so start
      # the Windows publish explicitly; it deploys the site once both installers exist.
      # Build the tagged commit, so both installers contain exactly the same code.
      - name: Build and publish Windows, then deploy both downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run windows.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f publish=true
