name: Release macOS app

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  # Needed to start the landing page deploy after the release is published.
  actions: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-macos:
    # The capture helper uses macOS 15 APIs and the app uses Liquid Glass, so build
    # with the macOS 26 SDK. Windows is built by the dispatched Windows workflow.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Check the tag matches the app version
        run: |
          VERSION=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the app version $VERSION in tauri.conf.json"
            exit 1
          fi

      - run: pnpm install --frozen-lockfile
      - run: pnpm test && pnpm typecheck
      # Builds the universal app, bundles the DMG, and recompresses it with LZMA.
      - run: pnpm build:macos

      - name: Verify the DMG
        run: |
          DMG=$(ls apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          MOUNT=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$MOUNT" "$DMG"
          APP="$MOUNT/ScreenSway.app"
          codesign --verify --deep --strict "$APP"
          for binary in screensway screensway-capture; do
            lipo "$APP/Contents/MacOS/$binary" -verify_arch arm64 x86_64
          done
          test -f "$APP/Contents/Resources/icon.icns"
          hdiutil detach "$MOUNT"
          cp "$DMG" ScreenSway-macos-universal.dmg
          shasum -a 256 ScreenSway-macos-universal.dmg | tee checksum.txt

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CHECKSUM=$(cut -d ' ' -f 1 checksum.txt)
          sed "s/__CHECKSUM__/$CHECKSUM/" .github/release-notes.md > notes.md
          gh release create "$GITHUB_REF_NAME" ScreenSway-macos-universal.dmg \
            --title "ScreenSway $GITHUB_REF_NAME" \
            --notes-file notes.md \
            --generate-notes \
            --verify-tag

      # Releases created with GITHUB_TOKEN do not trigger other workflows, so start
      # the Windows publish explicitly; it deploys the site once both installers exist.
      - name: Build and publish Windows, then deploy both downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run windows.yml --repo "$GITHUB_REPOSITORY" --ref main -f publish=true
