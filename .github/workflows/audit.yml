name: Dependency audit

# Published advisories for the JavaScript and Rust dependencies: weekly, whenever a lockfile
# changes, and on demand. A failing run means an advisory affects a locked version.
on:
  schedule:
    - cron: "17 2 * * 1"
  push:
    branches: [main]
    paths:
      - "pnpm-lock.yaml"
      - "apps/desktop/src-tauri/Cargo.lock"
      - "native/windows-capture/Cargo.lock"
      - ".github/workflows/audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  javascript:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.9.0
      # Reads the lockfile only; nothing is installed or run.
      - run: pnpm audit --audit-level moderate

  rust:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - run: cargo install cargo-audit --locked --version 0.22.2
      # Both lockfiles, including Windows-only crates (the audit reads Cargo.lock, not the target).
      # zip 4.x comes with tauri-plugin-updater (still on it in 2.14). Its advisories are about
      # extracting untrusted archives; the updater only unpacks signature-verified bundles and
      # ScreenSway ships .tar.gz (macOS) and .exe (Windows) updates, never .zip. Drop these
      # ignores once the plugin moves to zip >= 9.
      - run: >-
          cargo audit --file apps/desktop/src-tauri/Cargo.lock
          --ignore RUSTSEC-2026-0367 --ignore RUSTSEC-2026-0368 --ignore RUSTSEC-2026-0369
      - run: cargo audit --file native/windows-capture/Cargo.lock
