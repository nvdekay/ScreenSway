name: Deploy landing page

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/core/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/web.yml"
  # Re-deploy when a release is published so the site serves the new downloads.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @screensway/web build
      # The repository is private, so release assets are not publicly downloadable.
      # Serve the latest desktop builds from the landing page itself instead.
      - name: Bundle the latest desktop downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p apps/web/dist/download
          gh release download --repo "$GITHUB_REPOSITORY" \
            --pattern ScreenSway-macos-universal.dmg \
            --pattern ScreenSway-windows-x64-setup.exe \
            --pattern ScreenSway-windows-x64-setup.exe.sha256 \
            --dir apps/web/dist/download
          (cd apps/web/dist/download && sha256sum -c ScreenSway-windows-x64-setup.exe.sha256)
          ls -l apps/web/dist/download
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
