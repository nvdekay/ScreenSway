name: Deploy landing page

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "apps/studio-web/**"
      # The browser version reuses the desktop studio.
      - "apps/desktop/src/**"
      - "packages/core/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "scripts/build-update-manifest.mjs"
      - "scripts/publish-downloads.mjs"
      - "apps/site/**"
      - ".github/workflows/web.yml"
  # Re-deploy when a release is published so the site serves the new downloads.
  release:
    types: [published]
  workflow_dispatch:

# The build job installs and runs third-party packages, so it can only read the repository.
# Publishing (the downloads and Cloudflare tokens) happens in the deploy job, which runs no
# project dependencies: its scripts use Node's built-in modules only, plus a pinned wrangler.
permissions:
  contents: read

env:
  DOWNLOADS_URL: https://download.screensway.site

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.9.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @screensway/web build
        env:
          # Public URL of the analytics API (apps/analytics); local builds send nothing.
          VITE_ANALYTICS_URL: https://stats.screensway.site
          # Installers are served by the downloads Worker (apps/downloads), not by Pages:
          # Pages limits a site to 1 GB and ~100 GB of traffic a month.
          VITE_DOWNLOADS_URL: ${{ env.DOWNLOADS_URL }}
      # The browser version is served next to the landing page, at /app/.
      - run: |
          pnpm --filter @screensway/studio-web build
          cp -R apps/studio-web/dist apps/web/dist/app
        env:
          # Its anonymous usage counts go to the same analytics API, as source "studio".
          VITE_ANALYTICS_URL: https://stats.screensway.site
      # Handed to the deploy job through the Actions cache, which has its own storage,
      # so a full artifact quota cannot block a deploy.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/web/dist
          key: site-${{ github.run_id }}

  deploy:
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/web/dist
          key: site-${{ github.run_id }}
          fail-on-cache-miss: true
      # Installers are served from R2, not GitHub: no egress fees, range requests, stable URLs.
      # Copy the latest complete release to the downloads Worker. While a new release
      # is still waiting for its Windows installer, keep offering the current one.
      - name: Publish the latest desktop downloads
        id: downloads
        env:
          GH_TOKEN: ${{ github.token }}
          DOWNLOADS_UPLOAD_TOKEN: ${{ secrets.DOWNLOADS_UPLOAD_TOKEN }}
        run: |
          TAG=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          mkdir -p release
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.sha256' --dir release || true
          set +e
          node scripts/publish-downloads.mjs "$TAG" release
          STATUS=$?
          set -e
          if [ "$STATUS" -eq 2 ]; then
            TAG=$(curl -fsS "$DOWNLOADS_URL/current" | jq -r .tag)
            test -n "$TAG" && test "$TAG" != null
          elif [ "$STATUS" -ne 0 ]; then
            exit "$STATUS"
          fi
          curl -fsSI "$DOWNLOADS_URL/latest/ScreenSway-macos-universal.dmg" > /dev/null
          curl -fsSI "$DOWNLOADS_URL/latest/ScreenSway-windows-x64-setup.exe" > /dev/null
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Build the signed updater feed
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.downloads.outputs.tag }}
          DOWNLOADS_UPLOAD_TOKEN: ${{ secrets.DOWNLOADS_UPLOAD_TOKEN }}
        run: |
          mkdir -p apps/web/dist/update
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern ScreenSway-macos-universal.app.tar.gz.sig \
            --pattern ScreenSway-windows-x64-setup.exe.sig \
            --dir apps/web/dist/update
          UPDATE_PUB_DATE=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json publishedAt --jq .publishedAt)
          UPDATE_NOTES=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json name --jq .name)
          UPDATE_VERSION="$TAG"
          UPDATE_BASE_URL="$DOWNLOADS_URL/$TAG"
          export UPDATE_PUB_DATE UPDATE_NOTES UPDATE_VERSION UPDATE_BASE_URL
          node scripts/build-update-manifest.mjs
          rm apps/web/dist/update/*.sig
          node -e "JSON.parse(require('fs').readFileSync('apps/web/dist/update/latest.json'))"
          cat apps/web/dist/update/latest.json
          # The downloads Worker serves screensway.site/update/, so app updates do not wait
          # for the Pages deploy below; Pages keeps a copy as the fallback.
          curl -fsS -X PUT -H "Authorization: Bearer $DOWNLOADS_UPLOAD_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @apps/web/dist/update/latest.json "$DOWNLOADS_URL/admin/update"
      # The site is served from Cloudflare (apps/site), not GitHub Pages, whose deploys need
      # GitHub artifact storage. The version matches apps/downloads' lockfile.
      - name: Deploy the site to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.149.0 deploy --config apps/site/wrangler.toml
