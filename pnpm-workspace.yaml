packages:
  - apps/*
  - packages/*

# Shared dev tool versions ("catalog:" in package.json).
catalog:
  vitest: ^4.1.12

onlyBuiltDependencies:
  - esbuild
  - workerd
allowBuilds:
  esbuild: true
  workerd: true

# Patched undici for the dev tools (jsdom, wrangler's miniflare); see audit.yml.
overrides:
  undici@7: ^7.30.1
  undici@8: ^8.12.2
